
$terminal = ghostty
$shell = zsh
$fileManager = nautilus
$menu = rofi -show drun
$activeWindowScope = rofi -show window
$systemMonitor = $terminal -e btop


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# main binds 
bind = $mainMod, Q, exec, $terminal -e $shell
bind = $mainMod, C, killactive, 
bind = $mainMod SHIFT, delete, exit, 
bind = $mainMod SHIFT, E, exec, $fileManager
bind = $mainMod, V, togglefloating, 
bind = $mainMod, R, exec, $menu
bind = $mainMod, P,exec, pseudo, # dwindle
bind = $mainMod SHIFT, J, togglesplit, # dwindle
bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod, F, fullscreen
bind = $mainMod, TAB, exec, $activeWindowScope
bind = ,XF86Launch1, exec, $systemMonitor

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# workspace movement binds
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, B, togglespecialworkspace, sand
bind = $mainMod SHIFT, B, movetoworkspace, special:sand

bind = $mainMod, M, togglespecialworkspace, music
bind = $mainMod SHIFT, M, movetoworkspace, special:music


# printscreen binds
bind = $mainMod SHIFT, PRINT, exec, hyprshot -m region
bind = $mainMod SHIFT CTRL, PRINT, exec, hyprshot -m window --freeze
bind = $mainMod SHIFT, R, exec, killall -SIGUSR2 waybar

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Sound Binds

binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
binde = $mainMod, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
binde = $mainMod, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle


# Backlight control
bind = , xf86monbrightnessup, exec, brightnessctl s 1%+
bind = CTRL , xf86monbrightnessup, exec, brightnessctl s 10%+
bind = , xf86monbrightnessdown, exec, brightnessctl s 1%-
bind = CTRL , xf86monbrightnessdown, exec, brightnessctl s 10%-
bind = SUPER, xf86monbrightnessup, exec, brightnessctl s 100%
bind = SUPER, xf86monbrightnessdown, exec, brightnessctl s 1%


# Group binds
bind = $mainMod, t, togglegroup  # Toggle grouping for the current window
bind = $mainMod, g, moveoutofgroup  # Move the active window out of the current group
bind = $mainMod, x, changegroupactive, f  # Change to the next window in the group
bind = $mainMod, z, changegroupactive, b  # Change to the previous window in the group
bind = $mainMod, b, lockactivegroup  # Lock the focused group
