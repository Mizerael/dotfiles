
$primary_color = rgba(33ccffee)
$secondary_color = rgba(00ff99ee)
$passive_color = rgba(59595900)
$shadow_color = rgba(1a1a1aee)

general {
    # See https://wiki.hyprland.org/Configuring/Varianbles/ for more

    gaps_in = 5
    gaps_out = 15
    border_size = 2
    col.active_border = $primary_color $secondary_color 45deg
    col.inactive_border = $passive_color

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = true
        size = 2
        passes = 1
    }
    
    shadow {
      enabled = true
      range = 4
      render_power = 3
      color = $shadow_color
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}
group {
  col.border_active = $primary_color $secondary_color 45deg
  col.border_inactive = $passive_color
  groupbar{
    priority = 2
    col.active = $primary_color $secondary_color 45deg
    col.inactive = $passive_color
    height = 2
    render_titles = false
    }
}
dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    #new_is_master = true
}

gesture = 3, horizontal, workspace

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}
